<title>private.netjimb.com</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0b0f14;
    color: #e6edf3;

    padding: 0.85rem 1rem;
    border: 1px solid #2a323c;
    border-radius: 8px;
    background: #161c24;
    color: #e6edf3;
    text-decoration: none;
    font-size: 0.95rem;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  li a:hover { border-color: #6cb6ff; background: #1a2029; }
  li a .desc { display: block; margin-top: 0.15rem; color: #9aa7b2; font-size: 0.8rem; }
  footer { margin-top: 1.75rem; text-align: center; }
